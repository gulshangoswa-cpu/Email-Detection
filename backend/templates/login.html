{% extends "base.html" %}
{% block title %}Login - Gulshan AI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="glass-card p-5">
            <h2 class="text-center mb-4 text-gradient">Welcome Back</h2>
            <form method="POST" action="">
                <div class="mb-4">
                    <label class="form-label text-secondary">Email address</label>
                    <input type="email" class="form-control form-control-glass p-3" name="email" required placeholder="Enter your email">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Password</label>
                    <input type="password" class="form-control form-control-glass p-3" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-neon w-100 py-3 mt-2">Login to Dashboard</button>
            </form>
            <div class="text-center mt-4">
                <small class="text-secondary">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-info text-decoration-none">Sign up</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
